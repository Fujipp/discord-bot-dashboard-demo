spring.application.name=Backend

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/discord_server_management}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.sql.init.mode=never

app.frontend.url=${FRONTEND_URL:http://localhost:5173}
app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:http://localhost:5173}
app.jwt.secret=${JWT_SECRET:change-this-local-development-secret-to-at-least-32-characters}
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:86400}
app.bot-runner.ssh.user=${BOT_RUNNER_SSH_USER:root}
app.bot-runner.ssh.host=${BOT_RUNNER_SSH_HOST:localhost}
app.bot-runner.ssh.port=${BOT_RUNNER_SSH_PORT:22}
app.bot-runner.ssh.key-path=${BOT_RUNNER_SSH_KEY_PATH:}
app.bot-runner.pm2.binary=${BOT_RUNNER_PM2_BINARY:pm2}

spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:github-client-id}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:github-client-secret}
spring.security.oauth2.client.registration.github.scope=read:user,user:email

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:google-client-secret}
spring.security.oauth2.client.registration.google.scope=openid,email,profile

spring.security.oauth2.client.registration.discord.client-id=${DISCORD_CLIENT_ID:discord-client-id}
spring.security.oauth2.client.registration.discord.client-secret=${DISCORD_CLIENT_SECRET:discord-client-secret}
spring.security.oauth2.client.registration.discord.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.discord.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.discord.scope=identify,email
spring.security.oauth2.client.registration.discord.client-name=Discord
spring.security.oauth2.client.provider.discord.authorization-uri=https://discord.com/oauth2/authorize
spring.security.oauth2.client.provider.discord.token-uri=https://discord.com/api/oauth2/token
spring.security.oauth2.client.provider.discord.user-info-uri=https://discord.com/api/users/@me
spring.security.oauth2.client.provider.discord.user-name-attribute=id
